name: 部署 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 job 写 Pages + 拿 OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个 Pages 部署 (避免并发)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 上传 artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # SerialCube.html / index.html 都在仓库根
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
